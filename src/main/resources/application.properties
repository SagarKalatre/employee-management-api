spring.application.name=employee-management-api

server.port=8080

# MySQL connection
spring.datasource.url=jdbc:mysql://localhost:3306/employee_management_db
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA and Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Avoid unnecessary database access during response serialization
spring.jpa.open-in-view=false

# Consistent JSON date/time formatting
spring.jackson.serialization.write-dates-as-timestamps=false
